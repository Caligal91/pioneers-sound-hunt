<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Hunt · Pioneers Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --orange:#ef7d22; --navy:#1f2a44; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; font-family: "Andika", "Comic Sans MS", "Trebuchet MS", sans-serif; background:#f3f5f9; }
  #wrap { position:relative; width:100%; max-width:1100px; margin:0 auto; aspect-ratio:16/9; max-height:100vh; overflow:hidden; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.15); user-select:none; }
  #scene { position:absolute; inset:0; }
  .item { position:absolute; width:9%; aspect-ratio:1; transform:translate(-50%,-50%); cursor:pointer; transition:transform .15s; border:none; background:none; padding:0; }
  .item img { width:100%; height:100%; pointer-events:none; filter:drop-shadow(0 3px 2px rgba(0,0,0,.25)); }
  .item:hover { transform:translate(-50%,-50%) scale(1.08); }
  .item.found { animation:pop .4s ease; }
  .item.found::after { content:""; position:absolute; inset:-12%; border:5px solid #2ecc71; border-radius:50%; }
  .item.found .star { display:block; }
  .star { display:none; position:absolute; top:-22%; right:-22%; width:34%; height:34% !important; }
  .item.wrong { animation:shake .45s; }
  @keyframes pop { 0%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.3)} 100%{transform:translate(-50%,-50%) scale(1)} }
  @keyframes shake { 0%,100%{transform:translate(-50%,-50%)} 20%{transform:translate(-60%,-50%) rotate(-8deg)} 40%{transform:translate(-40%,-50%) rotate(8deg)} 60%{transform:translate(-57%,-50%) rotate(-5deg)} 80%{transform:translate(-45%,-50%) rotate(5deg)} }
  #badge { position:absolute; top:3%; left:2%; width:9%; aspect-ratio:1; border-radius:50%; background:var(--orange); border:5px solid #ffd34d; color:#fff; display:flex; align-items:center; justify-content:center; font-size:clamp(20px,4.2vw,48px); font-weight:bold; z-index:5; box-shadow:0 3px 8px rgba(0,0,0,.25); cursor:pointer; }
  #count { position:absolute; top:3%; right:2.5%; z-index:5; background:rgba(255,255,255,.85); color:var(--navy); border-radius:12px; padding:.2em .6em; font-size:clamp(18px,3.4vw,40px); font-weight:bold; }
  #toast { position:absolute; top:4%; left:50%; transform:translateX(-50%); z-index:6; background:rgba(31,42,68,.88); color:#fff; padding:.4em 1em; border-radius:30px; font-size:clamp(16px,2.6vw,30px); opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; }
  #overlay { position:absolute; inset:0; z-index:10; background:rgba(31,42,68,.75); display:flex; align-items:center; justify-content:center; }
  #overlay .card { background:#fff; border-radius:20px; padding:4% 6%; text-align:center; max-width:80%; }
  #overlay h1 { margin:.1em 0; color:var(--navy); font-size:clamp(22px,4.4vw,52px); }
  #overlay p { color:#455; font-size:clamp(15px,2.3vw,26px); margin:.4em 0 .8em; }
  #overlay .big { font-size:clamp(50px,10vw,120px); color:var(--orange); font-weight:bold; line-height:1; }
  .btn { background:var(--orange); color:#fff; border:none; border-radius:40px; padding:.45em 1.4em; font-size:clamp(16px,2.6vw,30px); font-family:inherit; font-weight:bold; cursor:pointer; box-shadow:0 3px 0 #b85c12; }
  .btn:active { transform:translateY(2px); box-shadow:none; }
  #mute { position:absolute; bottom:3%; right:2%; z-index:6; background:rgba(255,255,255,.8); border:none; border-radius:50%; width:5.5%; aspect-ratio:1; font-size:clamp(14px,2.2vw,26px); cursor:pointer; }
  .confetti { position:absolute; width:1.2%; aspect-ratio:1; top:-3%; z-index:11; animation:fall linear forwards; border-radius:2px; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  #credit { position:absolute; bottom:.6%; left:1%; font-size:9px; color:rgba(0,0,0,.35); z-index:6; font-family:sans-serif; }
</style>
</head>
<body>
<div id="wrap">
  <div id="scene"></div>
  <div id="badge" title="Hear the sound again"></div>
  <div id="count">0 / 10</div>
  <div id="toast"></div>
  <button id="mute" title="Sound on/off" aria-label="Sound on or off">🔊</button>
  <div id="overlay"></div>
  <div id="credit">Pictures: Microsoft Fluent Emoji (MIT) · Voice: ElevenLabs · © Pioneers Tutoring</div>
</div>
<script src="scenes.js?v=4"></script>
<script src="game.js?v=4"></script>
</body>
</html>
